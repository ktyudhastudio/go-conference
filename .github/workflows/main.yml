name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# deploy antre satu-satu; run PR tidak boleh menggeser antrean deploy
concurrency: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, docker]
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Debug SSH (sementara)
        env:
          U: ${{ secrets.DEPLOY_USER }}
          H: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Kunci yang dimuat runner:"; ssh-add -l
          ssh -o BatchMode=yes -o ConnectTimeout=10 -v "$U@$H" true 2>&1 | grep -E "Offering|Authentications|Server accepts|Permission|debug1: Authentication succeeded" || true
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
      - name: Write .env
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_HOST: ${{ secrets.APP_HOST }}
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_UDP_PORT_MIN: ${{ secrets.APP_UDP_PORT_MIN }}
          APP_UDP_PORT_MAX: ${{ secrets.APP_UDP_PORT_MAX }}
          STUN_SERVER: ${{ secrets.STUN_SERVER }}
        run: |
          for k in APP_ENV APP_NAME APP_HOST APP_PORT APP_UDP_PORT_MIN APP_UDP_PORT_MAX STUN_SERVER; do
            printf '%s=%s\n' "$k" "${!k}"
          done > .env
      - run: docker compose pull
      - run: docker compose up -d --no-build
      - run: docker image prune -f
      - if: always()
        run: docker logout ghcr.io
