name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# deploy antre satu-satu; run PR tidak boleh menggeser antrean deploy
concurrency: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, docker]
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_HOST: ssh://${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
      - run: echo "APP_HOST=${{ vars.APP_HOST }}" > .env
      - run: docker compose pull
      - run: docker compose up -d --no-build
      - run: docker image prune -f
      - if: always()
        run: docker logout ghcr.io
